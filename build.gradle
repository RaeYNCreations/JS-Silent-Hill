buildscript {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        maven { url = 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'net.neoforged.gradle:userdev:7.0.184'  // Updated to latest
    }
}

plugins {
    id 'net.neoforged.moddev' version '2.0.140'
    id 'java'
    id 'eclipse'
    id 'idea'
}

version = '3.0.0'
group = 'com.raeyncreations.jssilenthill'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

base {
    archivesName = 'silenthill'
}

neoForge {
    version = "${neo_version}"
    
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    
    mods {
        silenthill {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    // JUnit 5 for unit testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'Silent Hill',
                'Specification-Vendor'    : 'J.S.art',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'J.S.art',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Enable Java preview features
    options.compilerArgs.add('--enable-preview')
}

tasks.withType(Test).configureEach {
    // Enable previews for test execution if needed
    jvmArgs += ['--enable-preview']
}